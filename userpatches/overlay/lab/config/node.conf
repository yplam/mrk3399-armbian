# MRK3399 node settings. This file lives on the config partition (label
# MRKCONFIG), which survives mrk-reset and network upgrades.
#
# Format: one KEY=value per line, no quotes, no spaces around "=", lists
# separated by commas. Lines starting with # are ignored. The same file is
# read by the OS at boot and by U-Boot, which can't handle anything fancier.
# Windows line endings are fine.

# Host name. Empty: mrk-<last three bytes of the MAC>, e.g. mrk-a1b2c3.
HOSTNAME=

# IPv4 address of eth0: "dhcp", or an address with prefix length, e.g.
# 192.168.1.21/24 (then also set GATEWAY and DNS).
ADDRESS=dhcp
GATEWAY=
DNS=

# NTP servers. kubelet doesn't start until the clock is synchronised (the
# board has no battery-backed RTC). Empty: the DHCP-provided ones, else
# Debian's pool.
NTP=

# The lab TFTP server (IP address) for "run mrk_upgrade" at the U-Boot
# prompt; "setenv serverip" there overrides it. Nothing uses it at boot.
# Empty: the server has to be given by hand.
LAB_SERVER=
