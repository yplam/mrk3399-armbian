# Kubernetes node prerequisites; kubeadm's preflight checks the first three.
net.ipv4.ip_forward = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1

# Every pod's containers watch files (configmaps, logs, kubelet itself); the
# Debian defaults (128 instances) run out with a few dozen pods per node.
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
