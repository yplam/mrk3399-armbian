# The board has no battery-backed RTC, so it boots with a clock that's off by
# however long it was powered down. Every cluster certificate would look
# expired or not yet valid, and kubelet would fail its TLS bootstrap. Start
# kubelet only once systemd-timesyncd has synchronised the clock:
# systemd-time-wait-sync.service (enabled by customize-image.sh) holds
# time-sync.target until then.
[Unit]
Wants=time-sync.target network-online.target
After=time-sync.target network-online.target containerd.service
