# Build config for the MRK3399 Armbian image.
# Run `make build` from the repo root, or `./compile.sh mrk3399` from build/.
# See docs/design.md and https://docs.armbian.com/Developer-Guide_Build-Switches/

BOARD=mrk3399
BRANCH=current        # rockchip64 "current" = kernel 6.18
RELEASE=bookworm
BUILD_MINIMAL=yes     # CLI only, no desktop, smallest package set
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no   # never open menuconfig; see "Kernel configuration" in docs/design.md
INSTALL_HEADERS=no
SHARE_LOGS=no

# Work around the trixie build container failing `update-binfmts` (see extensions/qemu-binfmt-register.sh)
enable_extension "qemu-binfmt-register"
COMPRESS_OUTPUTIMAGE=sha,img,xz

# Mirrors for builds inside China without a proxy: tuna for kernel/firmware and
# apt, gitee for U-Boot, ghproxy (ghfast.top) for other GitHub fetches, nju for
# ghcr.io. Leave it commented when a proxy is set (make build PROXY_HOST=...,
# see README.md); enable it otherwise.
#REGIONAL_MIRROR=china

# Use build host DNS server inside chroot instead of default 1.0.0.1
NAMESERVER=$(grep nameserver /etc/resolv.conf | awk '{ print $2 }' | head -n 1)

# Unattended first boot. Armbian normally drops /root/.not_logged_in_yet and
# asks for a root password, a user, a shell, a locale and a timezone at the
# first login; userpatches/customize-image.sh applies the values below while
# building the image and removes that marker, so the board boots straight to a
# login prompt. See "Unattended first boot" in docs/design.md.
#
# Change them here, or per build without editing the file:
#   make build ARGS='MRK3399_USER=me MRK3399_USER_PASSWORD=secret'
# The passwords end up in the image and in the build log, so treat any image
# built with the defaults as untrusted on a public network.
export MRK3399_USER="${MRK3399_USER:-mrk}"
export MRK3399_USER_PASSWORD="${MRK3399_USER_PASSWORD:-mrk3399}"
export MRK3399_USER_REALNAME="${MRK3399_USER_REALNAME:-MRK3399}"
export MRK3399_TIMEZONE="${MRK3399_TIMEZONE:-Asia/Shanghai}"

# Root password. Armbian sets it while building the rootfs (its default is 1234).
ROOTPWD="${MRK3399_ROOT_PASSWORD:-mrk3399}"

# Locale generated in the image and written to /etc/default/locale. TZDATA is
# not settable the same way: main-config.sh overwrites it with the build host's
# /etc/timezone, so the timezone is set in customize-image.sh instead.
DEST_LANG="${MRK3399_LOCALE:-en_US.UTF-8}"

# No root autologin on ttyS2 or ttyGS0. Armbian enables it by default and
# relies on the first-login wizard to remove the getty overrides afterwards;
# the wizard no longer runs, so the overrides would never go away.
CONSOLE_AUTOLOGIN=no
